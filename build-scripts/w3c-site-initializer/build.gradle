// Site Initializer JAR — manifest defined in ../bnd.bnd
//
// The JAR is built manually from the workspace root (the workspace's
// JSTranspilerPlugin expects a `src/` folder this bundle does not have):
//
//   jar cfm build-scripts/w3c-site-initializer/build/libs/com.w3c.site.initializer-1.0.0.jar \
//     /tmp/w3c-manifest.mf \
//     -C . site-initializer -C . META-INF
//
// /tmp/w3c-manifest.mf contains the headers from ../bnd.bnd.
apply plugin: "java"
